name: Prepare authors

on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare or check
        required: true
        default: prepare
        type: choice
        options: [prepare, check]
      since:
        description: Commit range to scan
        required: true
        default: tag
        type: choice
        options: [tag, all]

permissions:
  contents: read

jobs:
  prepare:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-latest
    steps:
      - uses: conda/actions/prepare-authors@a034728c6eda6e652179526074be60f1e8f4b53f
        with:
          mode: ${{ inputs.mode }}
          since: ${{ inputs.since }}
          base-branch: main
          token: ${{ secrets.SYNC_TOKEN }}
